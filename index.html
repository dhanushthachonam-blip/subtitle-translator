<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtitle Translator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#1d1f2b;--mut:#6b7090;--pri:#4f46e5;--bd:#e1e3f0}
@media(prefers-color-scheme:dark){:root{--bg:#14151d;--card:#1e2030;--tx:#eceefb;--mut:#9aa0c3;--bd:#33364d}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans","Noto Sans Malayalam","Noto Sans Devanagari","Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin:0 0 6px}
select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;font-size:.9rem}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
button.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:1rem;cursor:pointer;margin-top:6px}
button.main:disabled{opacity:.4;cursor:not-allowed}
input[type=file]{display:none}
.drop{display:block;text-align:center;padding:22px;border:2px dashed var(--bd);border-radius:12px;cursor:pointer;color:var(--mut)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
#status{text-align:center;color:var(--mut);margin-top:8px;min-height:1.2em}
.about{text-align:center;margin-top:30px;color:var(--mut)}
.about b{display:block;font-size:1.8rem;letter-spacing:2px;color:var(--tx);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>

  <div class="card">
    <label data-i="ui"></label>
    <div class="chips" id="uiChips"></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 12px" data-i="select"></h3>
    <label data-i="source"></label>
    <select id="src"></select>
    <label data-i="target"></label>
    <select id="dst"></select>
  </div>

  <div class="card">
    <div class="drop" id="drop" role="button" tabindex="0"><span id="fname"></span></div>
    <input type="file" id="file" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
    <button class="main" id="go" disabled data-i="translate"></button>
    <div class="bar"><i id="prog"></i></div>
    <div id="status"></div>
    <button class="main" id="dl" disabled data-i="download"></button>
  </div>

  <div class="about"><span data-i="dev"></span><b>Dhanush</b></div>
</div>

<script>
const T={
en:{title:"Subtitle Translator",ui:"App language",select:"Select Language",source:"Source language",target:"Target language",upload:"Tap to upload .srt file",translate:"Translate",download:"Download translated .srt",dev:"Developed by",popular:"Popular",all:"All languages",auto:"Auto detect",working:"Translating...",done:"Translation complete",bad:"Invalid .srt file"},
hi:{title:"सबटाइटल ट्रांसलेटर",ui:"ऐप की भाषा",select:"भाषा चुनें",source:"स्रोत भाषा",target:"लक्ष्य भाषा",upload:".srt फ़ाइल अपलोड करने के लिए टैप करें",translate:"अनुवाद करें",download:"अनुवादित .srt डाउनलोड करें",dev:"डेवलपर",popular:"लोकप्रिय",all:"सभी भाषाएँ",auto:"स्वतः पहचानें",working:"अनुवाद हो रहा है...",done:"अनुवाद पूर्ण",bad:"अमान्य .srt फ़ाइल"},
ml:{title:"സബ്ടൈറ്റിൽ ട്രാൻസ്ലേറ്റർ",ui:"ആപ്പ് ഭാഷ",select:"ഭാഷ തിരഞ്ഞെടുക്കുക",source:"സോഴ്സ് ഭാഷ",target:"ടാർഗെറ്റ് ഭാഷ",upload:".srt ഫയൽ അപ്‌ലോഡ് ചെയ്യാൻ ടാപ്പ് ചെയ്യുക",translate:"വിവർത്തനം ചെയ്യുക",download:"വിവർത്തനം ചെയ്ത .srt ഡൗൺലോഡ് ചെയ്യുക",dev:"ഡെവലപ്പർ",popular:"പ്രധാന ഭാഷകൾ",all:"എല്ലാ ഭാഷകളും",auto:"സ്വയം കണ്ടെത്തുക",working:"വിവർത്തനം ചെയ്യുന്നു...",done:"വിവർത്തനം പൂർത്തിയായി",bad:"അസാധുവായ .srt ഫയൽ"},
ar:{title:"مترجم الترجمة",ui:"لغة التطبيق",select:"اختر اللغة",source:"لغة المصدر",target:"اللغة الهدف",upload:"اضغط لرفع ملف .srt",translate:"ترجمة",download:"تنزيل ملف .srt المترجم",dev:"تطوير",popular:"الأكثر استخداماً",all:"كل اللغات",auto:"اكتشاف تلقائي",working:"جارٍ الترجمة...",done:"اكتملت الترجمة",bad:"ملف .srt غير صالح"}
};
const PRI="en:English|hi:हिन्दी (Hindi)|ml:മലയാളം (Malayalam)|ar:العربية (Arabic)";
const ALL="af:Afrikaans|sq:Albanian|am:Amharic|hy:Armenian|az:Azerbaijani|eu:Basque|be:Belarusian|bn:Bengali|bs:Bosnian|bg:Bulgarian|ca:Catalan|ceb:Cebuano|zh-CN:Chinese (Simplified)|zh-TW:Chinese (Traditional)|co:Corsican|hr:Croatian|cs:Czech|da:Danish|nl:Dutch|eo:Esperanto|et:Estonian|fi:Finnish|fr:French|fy:Frisian|gl:Galician|ka:Georgian|de:German|el:Greek|gu:Gujarati|ht:Haitian Creole|ha:Hausa|haw:Hawaiian|he:Hebrew|hmn:Hmong|hu:Hungarian|is:Icelandic|ig:Igbo|id:Indonesian|ga:Irish|it:Italian|ja:Japanese|jv:Javanese|kn:Kannada|kk:Kazakh|km:Khmer|rw:Kinyarwanda|ko:Korean|ku:Kurdish|ky:Kyrgyz|lo:Lao|la:Latin|lv:Latvian|lt:Lithuanian|lb:Luxembourgish|mk:Macedonian|mg:Malagasy|ms:Malay|mt:Maltese|mi:Maori|mr:Marathi|mn:Mongolian|my:Myanmar (Burmese)|ne:Nepali|no:Norwegian|ny:Nyanja (Chichewa)|or:Odia|ps:Pashto|fa:Persian|pl:Polish|pt:Portuguese|pa:Punjabi|ro:Romanian|ru:Russian|sm:Samoan|gd:Scots Gaelic|sr:Serbian|st:Sesotho|sn:Shona|sd:Sindhi|si:Sinhala|sk:Slovak|sl:Slovenian|so:Somali|es:Spanish|su:Sundanese|sw:Swahili|sv:Swedish|tl:Tagalog (Filipino)|tg:Tajik|ta:Tamil|tt:Tatar|te:Telugu|th:Thai|tr:Turkish|tk:Turkmen|uk:Ukrainian|ur:Urdu|ug:Uyghur|uz:Uzbek|vi:Vietnamese|cy:Welsh|xh:Xhosa|yi:Yiddish|yo:Yoruba|zu:Zulu";
const parseList=s=>s.split("|").map(x=>{const i=x.indexOf(":");return[x.slice(0,i),x.slice(i+1)]});
const $=id=>document.getElementById(id);
let ui="en",blocks=null,out="",fileName="";

function fill(sel,withAuto,def){
  const t=T[ui];
  let h=withAuto?`<option value="auto">${t.auto}</option>`:"";
  h+=`<optgroup label="${t.popular}">`+parseList(PRI).map(([c,n])=>`<option value="${c}">${n}</option>`).join("")+"</optgroup>";
  h+=`<optgroup label="${t.all}">`+parseList(ALL).map(([c,n])=>`<option value="${c}">${n}</option>`).join("")+"</optgroup>";
  const keep=sel.value||def;
  sel.innerHTML=h;sel.value=keep;
}
function applyUI(){
  const t=T[ui];
  document.documentElement.dir=ui==="ar"?"rtl":"ltr";
  document.documentElement.lang=ui;
  $("title").textContent=t.title;document.title=t.title;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
  if(!fileName)$("fname").textContent=t.upload;
  fill($("src"),true,"auto");fill($("dst"),false,"ml");
  $("uiChips").innerHTML=PRI.split("|").map(x=>{const c=x.split(":")[0];
    return `<button class="chip ${c===ui?"on":""}" data-c="${c}">${x.split(":")[1].split(" ")[0]}</button>`}).join("");
  $("uiChips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ui=b.dataset.c;applyUI()});
}

function parseSrt(raw){
  raw=raw.replace(/\r\n/g,"\n").replace(/^\uFEFF/,"").trim();
  const res=[];
  for(const part of raw.split(/\n\s*\n/)){
    const L=part.split("\n"),t=L.findIndex(l=>l.includes("-->"));
    if(t<0)continue;
    res.push({head:L.slice(0,t).join("\n"),time:L[t],text:L.slice(t+1).join("\n")});
  }
  return res;
}
async function gt(text,sl,tl){
  if(!text.trim())return text;
  const u="https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+sl+"&tl="+tl+"&q="+encodeURIComponent(text);
  for(let i=0;i<3;i++){
    try{const r=await fetch(u);if(r.ok){const j=await r.json();return j[0].map(x=>x[0]||"").join("")}}catch(e){}
    await new Promise(r=>setTimeout(r,500*(i+1)));
  }
  return text; // fallback keeps original text, structure never breaks
}

$("drop").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const b=parseSrt(await f.text());e.target.value="";
  if(!b.length){$("status").textContent=T[ui].bad;return}
  blocks=b;fileName=f.name;out="";
  $("fname").textContent=f.name+" ("+b.length+")";
  $("go").disabled=false;$("dl").disabled=true;$("prog").style.width="0";$("status").textContent="";
};

$("go").onclick=async()=>{
  const sl=$("src").value,tl=$("dst").value,res=new Array(blocks.length);
  $("go").disabled=true;$("dl").disabled=true;$("status").textContent=T[ui].working;
  for(let i=0;i<blocks.length;i+=6){
    const end=Math.min(i+6,blocks.length);
    const r=await Promise.all(blocks.slice(i,end).map(b=>gt(b.text,sl,tl)));
    r.forEach((v,k)=>res[i+k]=v);
    $("prog").style.width=(end/blocks.length*100)+"%";
  }
  out=blocks.map((b,i)=>(b.head?b.head+"\n":"")+b.time+"\n"+res[i]+"\n").join("\n");
  $("status").textContent=T[ui].done;$("go").disabled=false;$("dl").disabled=false;
};

$("dl").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([out],{type:"text/plain;charset=utf-8"}));
  a.download=fileName.replace(/\.srt$/i,"")+"_"+$("dst").value+".srt";
  a.click();URL.revokeObjectURL(a.href);
};

applyUI();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
